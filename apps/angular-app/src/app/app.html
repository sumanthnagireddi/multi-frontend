<div class="dashboard-shell min-h-screen" [class.home-shell]="isHome" [class.ai-shell]="isAi" [class.finance-shell]="isFinance" [class.resources-shell]="isResources">
  @if (isAi || isFinance || isResources) {
    <header class="ai-clerk-nav">
      <a routerLink="/" class="ai-clerk-brand" aria-label="Sumanth workspace">
        <span class="ai-clerk-avatar">SN</span>
        <span>Sumanth</span>
      </a>
      <nav class="ai-clerk-links" aria-label="Main navigation">
        <a routerLink="/app/next/finance" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">Finance</a>
        <a routerLink="/ai" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">AI</a>
        <a routerLink="/app/react/resources">Resources</a>
      </nav>
      <div class="ai-clerk-actions">
        <button type="button" class="ai-clerk-theme" (click)="toggleTheme()" [attr.aria-label]="isDark ? 'Switch to light theme' : 'Switch to dark theme'">
          @if (isDark) { <span aria-hidden="true">☀</span> } @else { <span aria-hidden="true">☾</span> }
        </button>
        <a class="ai-clerk-cv" href="assets/Resume.pdf" download>Download CV</a>
        <button
          type="button"
          class="ai-mobile-menu-button"
          aria-label="Toggle navigation menu"
          [attr.aria-expanded]="mobileMenuOpen"
          (click)="mobileMenuOpen = !mobileMenuOpen">
          <span></span><span></span><span></span>
        </button>
      </div>
      @if (mobileMenuOpen) {
        <nav class="ai-mobile-menu" aria-label="Mobile navigation">
          <a routerLink="/app/next/finance" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" (click)="mobileMenuOpen = false">Finance</a>
          <a routerLink="/ai" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="mobileMenuOpen = false">AI</a>
          <a routerLink="/app/react/resources" (click)="mobileMenuOpen = false">Resources</a>
        </nav>
      }
    </header>
  } @else if (!isHome && !isFinance && !isResources) {
    <app-header></app-header>
  }
  <main class="dashboard-content" [class.home-content]="isHome || isAi || isFinance || isResources" [class.ai-content]="isAi" [class.finance-content]="isFinance" [class.resources-content]="isResources">
    <router-outlet></router-outlet>
  </main>
</div>
