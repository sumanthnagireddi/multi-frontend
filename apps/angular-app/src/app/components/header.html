<aside class="dashboard-sidebar" [class.mobile-open]="openMenu">
  <a routerLink="/" class="sidebar-brand" aria-label="Private workspace home">
    <span class="brand-mark">SN</span>
    <span>
      <strong>Workspace</strong>
      <small>Personal dashboard</small>
    </span>
  </a>

  <nav class="sidebar-nav" aria-label="Primary navigation">
    <span class="nav-label">Applications</span>
    <a [routerLink]="['/app','next','finance']"
       routerLinkActive="active"
       class="nav-item">
      <span class="material-symbols-outlined">account_balance_wallet</span>
      <span>Finance</span>
    </a>
    <a [routerLink]="['/app','next','ai']"
       routerLinkActive="active"
       class="nav-item">
      <span class="material-symbols-outlined">smart_toy</span>
      <span>AI</span>
    </a>
    <a [routerLink]="['/app','react','resources']"
       routerLinkActive="active"
       class="nav-item">
      <span class="material-symbols-outlined">library_books</span>
      <span>Resources</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="sidebar-action" (click)="toggleTheme()"
      [attr.title]="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <span class="material-symbols-outlined">{{ isDark ? 'light_mode' : 'dark_mode' }}</span>
      <span>{{ isDark ? 'Light mode' : 'Dark mode' }}</span>
    </button>
    <button type="button" class="sidebar-action" (click)="downloadPdf()">
      <span class="material-symbols-outlined">download</span>
      <span>Download CV</span>
    </button>
  </div>
</aside>

<button
  type="button"
  class="sidebar-mobile-toggle"
  (click)="toggleMenu()"
  [attr.aria-expanded]="openMenu"
  aria-label="Toggle navigation">
  <span class="material-symbols-outlined">{{ openMenu ? 'close' : 'menu' }}</span>
</button>

@if (openMenu) {
  <button type="button" class="sidebar-backdrop" (click)="toggleMenu()" aria-label="Close navigation"></button>
}
